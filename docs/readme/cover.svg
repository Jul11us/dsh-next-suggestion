<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">dsh-next-suggestion — A quieter way to keep moving.</title>
  <desc id="desc">An editorial cover on warm ivory with a large serif headline and a restrained forest green arrow. The plugin offers one to three optional next instructions after an assistant turn. Selecting a suggestion fills a draft; the user decides when to send.</desc>
  <rect width="1600" height="650" fill="#F5F2EB"/>
  <path d="M94 109H1506" stroke="#17201D" stroke-opacity=".22"/>
  <g fill="#17201D" font-family="Arial, Helvetica, sans-serif">
    <text x="129" y="73" font-size="22" letter-spacing="-.5" font-weight="600">dsh-next-suggestion</text>
    <text x="1506" y="69" text-anchor="end" font-size="10.5" letter-spacing="2">NEXT INSTRUCTION SUGGESTIONS / FOR DEEPSEEK DSH</text>
  </g>
  <path d="M94 72H112M105 65L112 72L105 79" stroke="#365D4B" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
  <text x="91" y="262" fill="#17201D" font-family="Georgia, 'Times New Roman', serif" font-size="104" letter-spacing="-5">A quieter way</text>
  <text x="91" y="374" fill="#17201D" font-family="Georgia, 'Times New Roman', serif" font-size="104" letter-spacing="-5">to keep moving.</text>
  <text x="97" y="442" fill="#53615A" font-family="Arial, Helvetica, sans-serif" font-size="19">Thoughtful next steps, right where your work continues.</text>
  <g stroke="#365D4B" stroke-linecap="square">
    <path d="M1064 420L1393 191M1240 188H1398V345" stroke-width="1.3" opacity=".16"/>
    <path d="M1124 446L1453 217M1300 214H1458V371" stroke-width="1.3" opacity=".16"/>
    <path d="M1097 433L1425 204M1271 201H1430V359" stroke-width="6"/>
  </g>
  <circle cx="1097" cy="433" r="6" fill="#F5F2EB" stroke="#365D4B" stroke-width="2"/>
  <text x="1187" y="482" fill="#365D4B" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">A LITTLE MOMENTUM.</text>
  <text x="1187" y="500" fill="#365D4B" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">ENTIRELY YOUR CALL.</text>
  <path d="M94 547H1506" stroke="#17201D" stroke-opacity=".22"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="590" fill="#365D4B" font-size="10" letter-spacing="1.9">01—03 / OPTIONAL CANDIDATES</text>
    <text x="576" y="590" fill="#53615A" font-size="13">Choose a suggestion. Refine your draft. Send when ready.</text>
    <text x="1506" y="590" text-anchor="end" fill="#17201D" font-size="10" letter-spacing="2">YOUR NEXT MOVE.</text>
  </g>
</svg>
